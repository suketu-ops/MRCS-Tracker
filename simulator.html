<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>MRCS Part A — Pearson VUE Simulator</title>
<style>
  /* ---------- Pearson VUE-style base ---------- */
  :root{
    --vue-navy:#1f3a5f;
    --vue-navy-2:#12304e;
    --vue-navy-3:#0b2542;
    --vue-yellow:#f2b01e;
    --vue-ink:#1a1a1a;
    --vue-muted:#5a6472;
    --vue-border:#b8bfc8;
    --vue-border-2:#d5dae0;
    --vue-bg:#e9ecef;
    --vue-panel:#ffffff;
    --vue-ok:#2e7d32;
    --vue-bad:#b71c1c;
    --vue-flag:#e9b000;
    --vue-link:#0b4a9c;
    --vue-row:#f6f8fa;
    --vue-strip:#edf1f5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family: Arial, Helvetica, "Liberation Sans", sans-serif;
    font-size:14px;
    color:var(--vue-ink);
    background:var(--vue-bg);
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;font-size:13px;cursor:pointer}
  .hidden{display:none !important}

  /* ---------- Top bar ---------- */
  .topbar{
    position:fixed;left:0;right:0;top:0;height:56px;
    background:linear-gradient(180deg,var(--vue-navy) 0%, var(--vue-navy-2) 100%);
    color:#fff;display:flex;align-items:center;z-index:50;
    border-bottom:1px solid #000;
    box-shadow:0 1px 0 rgba(0,0,0,.2), 0 2px 6px rgba(0,0,0,.15);
  }
  .topbar .brand{
    padding:0 14px;height:100%;display:flex;align-items:center;gap:10px;border-right:1px solid rgba(255,255,255,.15);
    font-weight:bold;letter-spacing:.3px;
  }
  .topbar .brand .vue-logo{
    background:var(--vue-yellow);color:#222;font-weight:800;font-size:11px;
    padding:3px 6px;border-radius:2px;letter-spacing:.4px;
  }
  .topbar .exam-title{padding:0 14px;font-size:13px;opacity:.95}
  .topbar .spacer{flex:1}
  .topbar .meta{
    display:flex;align-items:center;gap:18px;padding:0 14px;font-size:13px;
    border-left:1px solid rgba(255,255,255,.15);height:100%;
  }
  .topbar .meta .lbl{opacity:.75;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .topbar .meta .val{font-weight:bold}
  .topbar .meta .timer{
    background:#0a1f38;padding:6px 10px;border:1px solid rgba(255,255,255,.25);border-radius:3px;
    font-variant-numeric:tabular-nums;font-size:14px;font-weight:bold;
  }
  .topbar .meta .timer.warn{background:#7a1f1f;border-color:#ffb3b3}
  .topbar .iconbtn{
    background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;
    padding:6px 10px;border-radius:3px;font-size:12px;cursor:pointer;
  }
  .topbar .iconbtn:hover{background:rgba(255,255,255,.08)}
  .topbar .backbtn{
    background:transparent;border:none;color:#fff;font-size:13px;
    padding:6px 12px;cursor:pointer;opacity:.85;display:flex;align-items:center;gap:4px;
    border-right:1px solid rgba(255,255,255,.15);height:100%;
  }
  .topbar .backbtn:hover{opacity:1;background:rgba(255,255,255,.06)}
  /* Pause overlay */
  .pause-overlay{
    position:fixed;inset:0;background:rgba(10,20,40,.88);z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  }
  .pause-overlay h2{font-size:28px;margin-bottom:8px;font-weight:700}
  .pause-overlay p{opacity:.7;margin-bottom:24px;font-size:14px}
  .pause-overlay button{font-size:16px;padding:12px 36px}

  /* ---------- Main layout ---------- */
  .app{padding-top:56px;padding-bottom:64px;min-height:100vh}
  .shell{max-width:1180px;margin:0 auto;padding:18px;}
  .panel{
    background:var(--vue-panel);border:1px solid var(--vue-border);
    border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .panel .phead{
    background:linear-gradient(180deg,#f3f5f8 0%,#e5e9ef 100%);
    border-bottom:1px solid var(--vue-border);
    padding:10px 14px;font-weight:bold;font-size:13px;color:var(--vue-navy-2);
    display:flex;align-items:center;gap:10px;
  }
  .panel .pbody{padding:16px 18px}

  /* ---------- Bottom bar ---------- */
  .bottombar{
    position:fixed;left:0;right:0;bottom:0;height:56px;background:#ececec;
    border-top:1px solid #9aa3ad;display:flex;align-items:center;z-index:50;
    box-shadow:0 -1px 0 rgba(0,0,0,.05);
  }
  .bottombar .left{display:flex;gap:8px;padding:0 14px;align-items:center;flex:1}
  .bottombar .right{display:flex;gap:8px;padding:0 14px;align-items:center}
  .vbtn{
    background:linear-gradient(180deg,#fbfcfd 0%,#dde3ea 100%);
    border:1px solid #9aa3ad;color:#1a1a1a;
    padding:7px 14px;border-radius:3px;font-weight:bold;font-size:13px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
  }
  .vbtn:hover{background:linear-gradient(180deg,#ffffff 0%,#d1d8e0 100%)}
  .vbtn:active{background:#c6ced6}
  .vbtn.primary{
    background:linear-gradient(180deg,#2e63a6 0%,#1f3a5f 100%);
    color:#fff;border-color:#0b2542;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  }
  .vbtn.primary:hover{filter:brightness(1.05)}
  .vbtn.danger{
    background:linear-gradient(180deg,#d15a5a 0%,#8a1f1f 100%);
    color:#fff;border-color:#5a1010;
  }
  .vbtn.warn{
    background:linear-gradient(180deg,#f3c34b 0%,#cf8f1b 100%);color:#222;border-color:#8a5f10;
  }
  .vbtn[disabled]{opacity:.45;cursor:not-allowed}

  /* ---------- Question panel ---------- */
  .qwrap{
    background:#fff;border:1px solid var(--vue-border);border-radius:2px;
    min-height:calc(100vh - 160px);display:flex;flex-direction:column;
  }
  .qhead{
    background:linear-gradient(180deg,#f3f5f8 0%,#e5e9ef 100%);
    border-bottom:1px solid var(--vue-border);
    padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;
  }
  .qhead .tag{background:#eaeef3;border:1px solid #c9d1db;padding:2px 8px;border-radius:2px;color:#47556a;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
  .qhead .right{display:flex;align-items:center;gap:10px;color:#47556a}
  .qbody{padding:20px 26px;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:22px}
  .qbody.single{grid-template-columns:minmax(0,1fr)}
  .qstem{
    font-size:15.5px;line-height:1.55;color:#1a1a1a;white-space:pre-wrap;word-wrap:break-word;
  }
  .qstem p{margin:0 0 10px}
  .qoptions{margin-top:18px;display:flex;flex-direction:column;gap:8px}
  .qopt{
    display:flex;gap:10px;align-items:flex-start;
    border:1px solid var(--vue-border-2);background:#fbfcfd;
    padding:10px 12px;border-radius:2px;cursor:pointer;
  }
  .qopt:hover{background:#f3f7fc;border-color:#8fb4de}
  .qopt input{margin-top:3px;cursor:pointer}
  .qopt .letter{font-weight:bold;color:var(--vue-navy-2);min-width:18px}
  .qopt.selected{background:#e7f0fb;border-color:#2e63a6;box-shadow:inset 0 0 0 1px #2e63a6}
  .qopt.correct{background:#e6f4e6;border-color:#2e7d32}
  .qopt.incorrect{background:#fde7e7;border-color:#b71c1c}
  .qopt.reveal{background:#fff8e1;border-color:#cf8f1b}

  .qside{
    border-left:1px solid var(--vue-border-2);padding-left:18px;
  }
  .qside h4{margin:0 0 8px;font-size:12px;color:#47556a;letter-spacing:.4px;text-transform:uppercase}
  .qside .feedback{
    font-size:13px;line-height:1.5;background:#f6f8fa;border:1px solid #d5dae0;
    border-radius:2px;padding:10px;white-space:pre-wrap;
  }
  .qside .feedback.correct{background:#e9f5ea;border-color:#b0d4b3}
  .qside .feedback.wrong{background:#fbeaea;border-color:#e4b0b0}

  /* ---------- Review grid ---------- */
  .rev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:10px}
  .rev-cell{
    border:1px solid #9aa3ad;background:#fff;padding:8px 0;text-align:center;border-radius:2px;
    font-weight:bold;font-size:12px;cursor:pointer;position:relative;
  }
  .rev-cell:hover{background:#f1f4f8}
  .rev-cell.answered{background:#d9e8fb;border-color:#2e63a6}
  .rev-cell.flagged::after{
    content:"";position:absolute;top:2px;right:2px;width:0;height:0;
    border-left:6px solid transparent;border-bottom:6px solid transparent;border-top:6px solid var(--vue-flag);
  }
  .rev-cell.unanswered{background:#fff}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px;font-size:12px;color:#47556a}
  .legend .sw{display:inline-block;width:12px;height:12px;border:1px solid #9aa3ad;margin-right:6px;vertical-align:-2px}

  /* ---------- Start / config screens ---------- */
  .hero{
    background:linear-gradient(180deg,#1f3a5f 0%,#0b2542 100%);color:#fff;
    padding:28px;border-radius:2px;margin-bottom:18px;
    border:1px solid #000;
  }
  .hero h1{margin:0 0 4px;font-size:22px;letter-spacing:.3px}
  .hero p{margin:0;opacity:.85;font-size:13.5px}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:760px){.grid2{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .field label{font-size:12px;color:#47556a;font-weight:bold;letter-spacing:.3px}
  .field input[type="text"], .field input[type="number"], .field select, .field textarea{
    border:1px solid var(--vue-border);padding:8px 10px;border-radius:2px;font-family:inherit;font-size:13px;background:#fff;
  }
  .field .hint{font-size:11px;color:#6f7889}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chk{display:flex;gap:8px;align-items:center;font-size:13px}

  .drop{
    border:2px dashed #9aa3ad;background:#fafbfc;padding:22px;text-align:center;border-radius:3px;color:#47556a;
  }
  .drop.over{background:#eef4fb;border-color:#2e63a6;color:var(--vue-navy-2)}
  .drop input[type=file]{display:none}

  .chip{display:inline-block;background:#eaeef3;border:1px solid #c9d1db;color:#47556a;
    padding:2px 8px;border-radius:10px;font-size:11px;margin-right:6px}

  table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  table.tbl th,table.tbl td{border:1px solid var(--vue-border-2);padding:6px 8px;text-align:left;vertical-align:top}
  table.tbl th{background:#eef2f6;color:#47556a;font-weight:bold}
  table.tbl tr:nth-child(even) td{background:var(--vue-row)}

  /* Results */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 18px}
  @media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:#fff;border:1px solid var(--vue-border);padding:12px;border-radius:2px}
  .kpi .v{font-size:22px;font-weight:bold;color:var(--vue-navy-2)}
  .kpi .k{font-size:11px;color:#6f7889;letter-spacing:.3px;text-transform:uppercase}

  .confirm-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;
  }
  .confirm-box{background:#fff;border:1px solid #000;border-radius:3px;max-width:520px;width:92%;
    box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden}
  .confirm-box .hd{background:var(--vue-navy-2);color:#fff;padding:10px 14px;font-weight:bold;font-size:13px}
  .confirm-box .bd{padding:16px 18px;font-size:13.5px;line-height:1.5}
  .confirm-box .ft{padding:10px 14px;background:#f3f5f8;border-top:1px solid var(--vue-border);display:flex;gap:8px;justify-content:flex-end}

  /* small */
  .note{font-size:12px;color:#6f7889}
  a{color:var(--vue-link)}
  .divider{height:1px;background:var(--vue-border-2);margin:12px 0}
  details{background:#f6f8fa;border:1px solid var(--vue-border-2);border-radius:2px;padding:8px 10px;margin-top:8px;font-size:12.5px}
  details summary{cursor:pointer;font-weight:bold;color:var(--vue-navy-2)}

  .crumb{font-size:12px;color:#6f7889}
  .crumb b{color:var(--vue-navy-2)}
  pre.csv{background:#0b2542;color:#d6e4f7;padding:10px;border-radius:2px;font-size:11.5px;max-height:180px;overflow:auto;white-space:pre;border:1px solid #000}

  /* print */
  @media print{
    .topbar,.bottombar{display:none}
    .app{padding:0}
    .qwrap{border:none}
  }
</style>
</head>
<body>
<!-- TOP BAR -->
<header class="topbar">
  <button class="backbtn" id="btnBack" style="display:none" title="Back">◂</button>
  <div class="brand"><span class="vue-logo">VUE</span><span>Pearson</span></div>
  <div class="exam-title" id="barTitle">MRCS Part A — Wrong Questions Review</div>
  <div class="spacer"></div>
  <div class="meta" id="barMeta" style="display:none">
    <div><div class="lbl">Question</div><div class="val"><span id="qNow">-</span> / <span id="qTotal">-</span></div></div>
    <div><div class="lbl">Flagged</div><div class="val" id="qFlagged">0</div></div>
    <div><div class="lbl" id="timerLabel">Time Remaining</div><div class="timer" id="timer">--:--:--</div></div>
  </div>
  <div class="meta">
    <button class="iconbtn" id="btnHelp" title="Keyboard shortcuts">?</button>
  </div>
</header>

<main class="app">
  <div class="shell" id="root"></div>
</main>

<!-- BOTTOM BAR -->
<footer class="bottombar" id="bottombar" style="display:none">
  <div class="left">
    <button class="vbtn" id="btnPrev">◂ Previous</button>
    <button class="vbtn warn" id="btnFlag">⚑ Flag for Review</button>
    <button class="vbtn" id="btnStrike">Highlight / Strikethrough</button>
    <button class="vbtn" id="btnReveal" style="display:none">Reveal Answer</button>
  </div>
  <div class="right">
    <button class="vbtn" id="btnPause" title="Pause exam & timer">⏸ Pause</button>
    <button class="vbtn" id="btnReview">Review ▸</button>
    <button class="vbtn danger" id="btnEnd">End Exam</button>
    <button class="vbtn primary" id="btnNext">Next ▸</button>
  </div>
</footer>

<script>
/* ===========================================================
   MRCS VUE Simulator — single-file app
   - CSV import with auto-detect + manual mapping
   - Paper modes: MRCS Paper 1 (180q/180min), Paper 2 (120q/120min), Custom
   - Two modes: Strict exam (no feedback) OR Tutor (reveal while attempting)
   - Flag for review, review screen, timed countdown
   - Progress saved in localStorage per exam session id
   =========================================================== */

const LS_KEY  = 'mrcs-vue:v1';
const LS_BANK = 'mrcs-vue:bank:v1';    // last uploaded question bank
const LS_HIST = 'mrcs-vue:history:v1'; // completed session summaries
const LS_ATT  = 'mrcs-vue:attempts:v1';// per-question attempt log keyed by stem hash












const EMBEDDED_BANK_VERSION = "2026-04-20-v18";


const state = {
  screen: 'home',          // home | mapping | config | exam | review | results | history
  bank: [],                // [{id, qhash, stem, options:[{letter,text}], correctLetter, explanation, topic, source}]
  session: null,           // see newSession()
  rawCsv: null,            // parsed {headers, rows}
  mapping: null,           // column mapping
  timerHandle: null,
};

/* ---------- Attempt log helpers ---------- */
function hashStem(str){
  // stable 32-bit hash so the same question text maps to the same id across CSV re-uploads
  const s = String(str||'').replace(/\s+/g,' ').trim().toLowerCase();
  let h = 2166136261 >>> 0;
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return ('00000000' + h.toString(16)).slice(-8);
}
function loadAttempts(){ return loadLS(LS_ATT) || {}; }
function saveAttempts(a){ saveLS(LS_ATT, a); }
function loadHistory(){ return loadLS(LS_HIST) || []; }
function saveHistory(h){ saveLS(LS_HIST, h); }
function recordAttempt(q, result){
  // result: 'correct' | 'wrong'
  const a = loadAttempts();
  const rec = a[q.qhash] || {qhash:q.qhash, stem:q.stem.slice(0,180), topic:q.topic||'', subject:q.subject||'', source:q.source||'', seen:0, correct:0, wrong:0, blank:0, lastResult:null, lastAt:null, history:[]};
  if (!rec.subject && q.subject) rec.subject = q.subject; // backfill for older records
  rec.seen += 1;
  rec[result] = (rec[result]||0) + 1;
  rec.lastResult = result;
  rec.lastAt = Date.now();
  rec.stem = q.stem.slice(0,180);
  rec.topic = q.topic || rec.topic;
  rec.source = q.source || rec.source;
  rec.history = (rec.history || []).concat([{at:Date.now(), r:result}]).slice(-20);
  a[q.qhash] = rec;
  saveAttempts(a);
}

/* Revert attempt records for a deleted/abandoned session.
   Uses the session's qhashes + startedAt to find and remove matching history entries.
   If a question has no remaining history, delete the record entirely. */
function revertSessionAttempts(sessionHist){
  if (!sessionHist || !sessionHist.qhashes || !sessionHist.qhashes.length) return;
  const a = loadAttempts();
  const sessionTime = sessionHist.startedAt || 0;
  sessionHist.qhashes.forEach(qh => {
    const rec = a[qh];
    if (!rec) return;
    // Find the history entry closest to this session's startedAt (within 24h)
    const hIdx = (rec.history||[]).findIndex(h => Math.abs((h.at||h.t||0) - sessionTime) < 24*60*60*1000);
    if (hIdx >= 0){
      const removed = rec.history.splice(hIdx, 1)[0];
      rec.seen = Math.max(0, (rec.seen||1) - 1);
      if (removed.r === 'correct') rec.correct = Math.max(0, (rec.correct||1) - 1);
      else if (removed.r === 'wrong') rec.wrong = Math.max(0, (rec.wrong||1) - 1);
      else rec.blank = Math.max(0, (rec.blank||1) - 1);
    }
    // If no history left, remove the record entirely
    if (!rec.history || rec.history.length === 0){
      delete a[qh];
    } else {
      // Update lastResult/lastAt from remaining history
      const last = rec.history[rec.history.length - 1];
      rec.lastResult = last.r;
      rec.lastAt = last.at || last.t;
      a[qh] = rec;
    }
  });
  saveAttempts(a);
}

/* ---------- Utilities ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const el = (tag, props={}, kids=[]) => {
  const n = document.createElement(tag);
  for (const k in props){
    if (k === 'class') n.className = props[k];
    else if (k === 'html') n.innerHTML = props[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if (k === 'style' && typeof props[k] === 'object') Object.assign(n.style, props[k]);
    else if (k === 'dataset') Object.assign(n.dataset, props[k]);
    else n.setAttribute(k, props[k]);
  }
  (Array.isArray(kids)?kids:[kids]).forEach(c => {
    if (c == null) return;
    n.appendChild((typeof c === 'string' || typeof c === 'number') ? document.createTextNode(String(c)) : c);
  });
  return n;
};
const fmtHMS = (ms) => {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms/1000);
  const hh = String(Math.floor(s/3600)).padStart(2,'0');
  const mm = String(Math.floor((s%3600)/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  return `${hh}:${mm}:${ss}`;
};
const shuffle = (a) => {
  for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
};
function saveLS(key,obj){try{localStorage.setItem(key, JSON.stringify(obj));}catch(e){console.warn('LS save failed for',key,e);if(key===LS_ATT){alert('⚠️ Could not save your attempt log — localStorage is full. Your progress for this session may not be recorded. Try clearing the question bank from Settings.');}}}

function loadLS(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}}

/* ---------- CSV parser (RFC-4180 tolerant) ---------- */
function parseCSV(text){
  // auto-detect delimiter by first non-quoted line
  const firstLine = (()=>{
    let inQ=false, out='', i=0;
    for(; i<text.length;i++){
      const c=text[i];
      if(c==='"' && text[i+1]==='"'){out+='""';i++;continue;}
      if(c==='"'){inQ=!inQ;out+='"';continue;}
      if(!inQ && (c==='\n'||c==='\r')) break;
      out+=c;
    }
    return out;
  })();
  const counts = {',':0,';':0,'\t':0,'|':0};
  let inQ=false;
  for(const c of firstLine){
    if(c==='"'){inQ=!inQ;continue;}
    if(!inQ && c in counts) counts[c]++;
  }
  const delim = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0] || ',';

  const rows=[]; let cur=[]; let cell=''; let inQuote=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (inQuote){
      if (c==='"'){
        if (text[i+1]==='"'){cell+='"';i++;} else {inQuote=false;}
      } else cell+=c;
    } else {
      if (c==='"'){inQuote=true;}
      else if (c===delim){cur.push(cell);cell='';}
      else if (c==='\n'){cur.push(cell);rows.push(cur);cur=[];cell='';}
      else if (c==='\r'){/* swallow */}
      else cell+=c;
    }
  }
  if (cell.length || cur.length){cur.push(cell);rows.push(cur);}
  // trim empties at end
  while (rows.length && rows[rows.length-1].every(x=>!x || !String(x).trim())) rows.pop();
  if (!rows.length) return {headers:[],rows:[],delim};
  const headers = rows.shift().map(h => String(h||'').trim());
  const objs = rows.map(r => {
    const o = {};
    headers.forEach((h,i)=> o[h] = (r[i]==null?'':String(r[i])));
    return o;
  });
  return {headers, rows:objs, delim};
}

/* ---------- Column auto-detect ---------- */
const HEADER_HINTS = {
  stem: ['question','stem','q','question_text','questiontext','body','prompt','vignette','clinical scenario','scenario'],
  optA: ['a','option a','optiona','option_a','choice a','choicea','choice_a','ansa','answer a'],
  optB: ['b','option b','optionb','option_b','choice b','choiceb','choice_b','ansb','answer b'],
  optC: ['c','option c','optionc','option_c','choice c','choicec','choice_c','ansc','answer c'],
  optD: ['d','option d','optiond','option_d','choice d','choiced','choice_d','ansd','answer d'],
  optE: ['e','option e','optione','option_e','choice e','choicee','choice_e','anse','answer e'],
  correct: ['correct','correct answer','correct_answer','answer','correctletter','correct_letter','ans','right','key'],
  explanation: ['explanation','rationale','answer explanation','answer_explanation','teaching','feedback','notes','explanation_text','exp'],
  topic: ['topic','category','specialty','subject','subcategory','system','chapter','module'],
  source: ['source','bank','origin','platform']
};
function autoMap(headers){
  const lc = headers.map(h => String(h||'').toLowerCase().trim());
  const map = {};
  const find = (cands) => {
    for (const cand of cands){
      const i = lc.indexOf(cand);
      if (i >= 0) return headers[i];
    }
    // loose contains
    for (const cand of cands){
      const i = lc.findIndex(h => h.includes(cand));
      if (i >= 0) return headers[i];
    }
    return '';
  };
  for (const k of Object.keys(HEADER_HINTS)) map[k] = find(HEADER_HINTS[k]);
  return map;
}

/* Infer options when columns are "Option 1..5" or compact formats */
function extractOptions(row, mapping){
  const picks = ['optA','optB','optC','optD','optE']
    .map((k,i) => ({letter: String.fromCharCode(65+i), key:mapping[k], text: mapping[k] ? String(row[mapping[k]]||'').trim() : ''}))
    .filter(o => o.text.length);
  return picks;
}

/* Normalise "correct" column to a single letter A-E */
function extractCorrect(row, mapping, opts){
  let raw = mapping.correct ? String(row[mapping.correct]||'').trim() : '';
  if (!raw) return '';
  // "A", "a", "1", "Option B", "B: acute appendicitis"
  raw = raw.replace(/^option[\s_-]*/i,'').trim();
  // numeric
  const n = parseInt(raw,10);
  if (!isNaN(n) && n >= 1 && n <= opts.length){
    return String.fromCharCode(64+n);
  }
  // single letter
  const m = raw.match(/^[A-Ea-e]/);
  if (m) return m[0].toUpperCase();
  // match against option text
  const lc = raw.toLowerCase();
  const hit = opts.find(o => o.text.toLowerCase() === lc || lc.startsWith(o.text.toLowerCase()));
  if (hit) return hit.letter;
  return '';
}

/* Build bank from parsed CSV + mapping */
function buildBank(parsed, mapping){
  const bank = [];
  let skipped = 0;
  parsed.rows.forEach((row, idx) => {
    const stem = mapping.stem ? String(row[mapping.stem]||'').trim() : '';
    if (!stem) {skipped++; return;}
    const opts = extractOptions(row, mapping);
    if (opts.length < 2) {skipped++; return;}
    const correct = extractCorrect(row, mapping, opts);
    const explanation = mapping.explanation ? String(row[mapping.explanation]||'').trim() : '';
    const topic = mapping.topic ? String(row[mapping.topic]||'').trim() : '';
    const source = mapping.source ? String(row[mapping.source]||'').trim() : '';
    bank.push({
      id: 'q'+(idx+1),
      qhash: hashStem(stem),
      stem, options:opts, correctLetter: correct,
      explanation, topic, source
    });
  });
  return {bank, skipped};
}

/* ---------- Session factory ---------- */
function newSession(opts){
  const {bank, paper, mode, durationMs, shuffleQ, shuffleOpts, questionCount, flagged, showAnswers} = opts;
  let pool = bank.slice();
  if (shuffleQ) shuffle(pool);
  if (questionCount && questionCount < pool.length) pool = pool.slice(0, questionCount);

  const questions = pool.map((q,i) => {
    const options = q.options.map(o => ({...o}));
    let correct = q.correctLetter;
    if (shuffleOpts){
      // preserve letters A..E positions but scramble text; remap correctLetter to the new position of the correct text
      const correctText = options.find(o => o.letter === correct)?.text ?? '';
      const texts = options.map(o => o.text);
      shuffle(texts);
      options.forEach((o,j) => { o.text = texts[j]; });
      const newIdx = options.findIndex(o => o.text === correctText);
      correct = newIdx >= 0 ? String.fromCharCode(65+newIdx) : correct;
    }
    return {
      ...q, options, correctLetter: correct,
      selected: null, flagged:false, visited:false, timeSpent:0
    };
  });

  return {
    id: 'sess-'+Date.now(),
    paper, mode, showAnswers: !!showAnswers,
    durationMs, startedAt: Date.now(), endedAt: null,
    timeLeftMs: durationMs,
    idx: 0, questions,
    paused:false, submitted:false,
  };
}

function canonTopic(t, subj){
  if (!t && !subj) return '';
  // Try subject first (more reliable after re-tagging)
  if (subj){
    const sj = String(subj).toLowerCase().trim();
    if (TOPIC_ALIASES[sj]) return TOPIC_ALIASES[sj];
  }
  const s = String(t||'').toLowerCase().trim();
  if (TOPIC_ALIASES[s]) return TOPIC_ALIASES[s];
  // loose contains on topic
  for (const k of Object.keys(TOPIC_ALIASES)){
    if (s && s.includes(k)) return TOPIC_ALIASES[k];
  }
  // loose contains on subject
  if (subj){
    const sj = String(subj).toLowerCase().trim();
    for (const k of Object.keys(TOPIC_ALIASES)){
      if (sj.includes(k)) return TOPIC_ALIASES[k];
    }
  }
  return '';
}
function syllabusLabel(key){
  const all = [...MRCS_SYLLABUS.paper1, ...MRCS_SYLLABUS.paper2];
  return (all.find(x => x.key === key)?.label) || '';
}

/* Arrange a pool to match MRCS blueprint proportions.
   - paper: 'paper1' | 'paper2' | 'all'
   - targetN: total questions desired
   - Returns a sub-array of pool, sampled per-bucket at the syllabus weight.
*/
function arrangeByBlueprint(pool, paper, targetN){
  const blueprint = paper === 'paper1' ? MRCS_SYLLABUS.paper1
                  : paper === 'paper2' ? MRCS_SYLLABUS.paper2
                  : [...MRCS_SYLLABUS.paper1, ...MRCS_SYLLABUS.paper2].map(b => ({...b, weight: b.weight/2}));
  // build buckets
  const buckets = {};
  blueprint.forEach(b => { buckets[b.key] = []; });
  pool.forEach(q => {
    const k = q.topicCanon || canonTopic(q.topic, q.subject);
    if (buckets[k]) buckets[k].push(q);
    else (buckets._other = buckets._other || []).push(q);
  });
  // sample per bucket
  Object.keys(buckets).forEach(k => shuffle(buckets[k]));
  const picked = [];
  blueprint.forEach(b => {
    const want = Math.round(targetN * b.weight);
    const take = buckets[b.key].splice(0, want);
    picked.push(...take);
  });
  // top up from leftovers (including _other) if we under-filled
  const leftover = [].concat(...Object.values(buckets));
  shuffle(leftover);
  while (picked.length < targetN && leftover.length) picked.push(leftover.shift());
  // interleave so same-topic isn't back-to-back
  const byKey = {};
  picked.forEach(q => { const k = q.topicCanon || canonTopic(q.topic, q.subject) || '_'; (byKey[k] = byKey[k] || []).push(q); });
  const keys = Object.keys(byKey); shuffle(keys);
  const out = []; let remaining = picked.length;
  while (remaining > 0){
    for (const k of keys){ if (byKey[k].length){ out.push(byKey[k].shift()); remaining--; } }
  }
  return out;
}

/* ---------- Filter / arrange helpers ---------- */
function filterBankByAttempts(bank, cfg){
  const a = loadAttempts();
  let pool = bank.slice();

  if (cfg.onlyNeverSeen){
    pool = pool.filter(q => !a[q.qhash] || a[q.qhash].seen === 0);
  }
  if (cfg.onlyLastWrong){
    pool = pool.filter(q => a[q.qhash] && a[q.qhash].lastResult === 'wrong');
  }
  if (cfg.onlyNeverCorrect){
    pool = pool.filter(q => !a[q.qhash] || a[q.qhash].correct === 0);
  }
  if (cfg.excludeMastered && cfg.masterN > 0){
    // exclude if correct count >= masterN
    pool = pool.filter(q => !a[q.qhash] || (a[q.qhash].correct||0) < cfg.masterN);
  }
  if (cfg.excludeSeenInSession && cfg.excludeSessionId){
    const hist = loadHistory();
    const prev = hist.find(h => h.id === cfg.excludeSessionId);
    if (prev){
      const seenSet = new Set(prev.qhashes||[]);
      pool = pool.filter(q => !seenSet.has(q.qhash));
    }
  }
  if (cfg.topicFilter && cfg.topicFilter.length){
    const set = new Set(cfg.topicFilter);
    pool = pool.filter(q => set.has(q.topic || '(untagged)'));
  }
  if (cfg.sourceFilter && cfg.sourceFilter.length){
    const set = new Set(cfg.sourceFilter);
    pool = pool.filter(q => set.has(q.source || '(unknown)'));
  }
  return pool;
}
function arrangePool(pool, mode){
  if (mode === 'random'){
    return shuffle(pool.slice());
  }
  if (mode === 'grouped'){
    // group by topic in alphabetical order of topic
    const groups = {};
    pool.forEach(q => { const t=q.topic||'(untagged)'; (groups[t]=groups[t]||[]).push(q); });
    const out = [];
    Object.keys(groups).sort().forEach(t => groups[t].forEach(q => out.push(q)));
    return out;
  }
  if (mode === 'interleaved'){
    // round-robin across topics so similar topics aren't back-to-back (MRCS feel)
    const groups = {};
    pool.forEach(q => { const t=q.topic||'(untagged)'; (groups[t]=groups[t]||[]).push(q); });
    Object.values(groups).forEach(arr => shuffle(arr));
    const keys = Object.keys(groups);
    shuffle(keys);
    const out = [];
    let remaining = pool.length;
    while (remaining > 0){
      for (const k of keys){
        if (groups[k].length){ out.push(groups[k].shift()); remaining--; }
      }
    }
    return out;
  }
  return pool.slice(); // 'csv' — keep file order
}

/* When multiple CSVs are dropped, queue them so that after mapping one we
   automatically start the next. On the first file we show the mapping screen;
   for subsequent files we auto-apply the same mapping if headers match.  */
function queueFiles(files){
  state.fileQueue = files.slice();
  loadNextQueuedFile();
}
function loadNextQueuedFile(){
  if (!state.fileQueue || !state.fileQueue.length) return false;
  const f = state.fileQueue.shift();
  loadFile(f);
  return true;
}

function loadFile(file){
  const sourceSel = document.getElementById('uploadSource');
  const modeSel = document.getElementById('uploadMode');
  state.uploadSourceOverride = sourceSel ? (sourceSel.value === '(use source column from CSV)' ? '' : sourceSel.value) : '';
  state.uploadAppend = modeSel ? (modeSel.value === 'append') : !!(state.bank && state.bank.length);
  state.uploadingFileName = file.name;
  const fr = new FileReader();
  fr.onload = () => {
    const text = String(fr.result || '');
    try{
      const parsed = parseCSV(text);
      if (!parsed.headers.length){ alert('CSV appears empty or unreadable.'); return; }
      state.rawCsv = parsed;
      // If we already have a mapping and the headers match, auto-apply and skip
      // the mapping screen — nice for batch uploads of the same template.
      const prevMap = state.lastMapping;
      const headerSet = new Set(parsed.headers);
      const reusable = prevMap && ['stem','optA','optB','correct'].every(k => !prevMap[k] || headerSet.has(prevMap[k]));
      if (reusable && state.fileQueue){ /* multi-file mode */
        state.mapping = {...prevMap};
        autoBuildAndContinue();
      } else {
        state.mapping = autoMap(parsed.headers);
        state.screen = 'mapping'; render();
      }
    }catch(e){ alert('CSV parse failed: '+e.message); }
  };
  fr.readAsText(file);
}

/* Auto-build bank & either continue with queued files or head to config */
function autoBuildAndContinue(){
  const {bank, skipped} = buildBank(state.rawCsv, state.mapping);
  if (bank.length){
    if (state.uploadSourceOverride) bank.forEach(q => { q.source = state.uploadSourceOverride; });
    bank.forEach(q => { q.topicRaw = q.topic; q.topicCanon = canonTopic(q.topic, q.subject); });
    if (state.uploadAppend && Array.isArray(state.bank) && state.bank.length){
      const seen = new Set(state.bank.map(q => q.qhash));
      const add = bank.filter(q => !seen.has(q.qhash));
      state.bank = state.bank.concat(add);
    } else {
      state.bank = bank;
      state.uploadAppend = true; // subsequent files in the queue should append
    }
    saveLS(LS_BANK, {bank: state.bank, savedAt: Date.now()});
  }
  if (state.fileQueue && state.fileQueue.length){
    loadNextQueuedFile();
  } else {
    state.screen = 'config'; render();
  }
}

    el('span',{},'Delimiter: '),el('b',{},JSON.stringify(state.rawCsv.delim).replace(/"/g,''))
  ]));

  const grid = el('div',{class:'grid2'});
  const mkField = (key,label,hint)=>{
    const f = el('div',{class:'field'});

  };
  grid.appendChild(mkField('stem','Question / stem','Required'));

    el('button',{class:'vbtn', onClick:()=>{state.screen='home';render();}}, '◂ Back'),
    el('button',{class:'vbtn primary', id:'btnBuildBank', onClick:()=>{
      const {bank, skipped} = buildBank(state.rawCsv, state.mapping);
      if (!bank.length){ alert('No valid questions could be built. Check the mapping.'); return; }
      // Apply upload source override
      if (state.uploadSourceOverride){
        bank.forEach(q => { q.source = state.uploadSourceOverride; });
      }
      // Normalise topic to canonical MRCS syllabus bucket (keeps original in q.topicRaw)
      bank.forEach(q => { q.topicRaw = q.topic; q.topicCanon = canonTopic(q.topic, q.subject); });
      // Merge / replace
      if (state.uploadAppend && Array.isArray(state.bank) && state.bank.length){
        // dedupe by qhash
        const seen = new Set(state.bank.map(q => q.qhash));
        const add = bank.filter(q => !seen.has(q.qhash));
        state.bank = state.bank.concat(add);
      } else {

      saveLS(LS_BANK, {bank: state.bank, savedAt: Date.now()});

      state.screen = 'config'; render();

  ]);
  body.appendChild(actions);
  panel.appendChild(body);
  root.appendChild(panel);

  refreshPreview();

  function gatherCfg(){
    const selTopics = $$('#topicsHost input[type=checkbox]').filter(c => c.checked).map(c => c.getAttribute('data-topic'));

    const selSources = sourceHost
      ? Array.from(sourceHost.querySelectorAll('input[type=checkbox]')).filter(c => c.checked).map(c => c.getAttribute('data-source'))
      : null;
    return {
      onlyWithCorrect: $('#onlyWithCorrect').checked,
      onlyNeverSeen: $('#fNeverSeen').checked,
      onlyLastWrong: $('#fLastWrong').checked,
      onlyNeverCorrect: $('#fNeverCorrect').checked,
      excludeMastered: $('#fMastered').checked,

      excludeSessionId: $('#fExcludeSession') ? $('#fExcludeSession').value : '',
      topicFilter: selTopics,
      sourceFilter: selSources,
      arrange: $('#arrange').value,
      shuffleOpts: $('#shuffleOpts').checked,
    };
  }

  function computePool(cfg){
    let pool = state.bank.slice();
    if (cfg.onlyWithCorrect) pool = pool.filter(q => q.correctLetter);
    pool = filterBankByAttempts(pool, cfg);
    return pool;
  }

  function refreshFilterPreview(){
    const cfg = gatherCfg();
    const pool = computePool(cfg);
    const host = $('#filterPreview');
    host.innerHTML = '';
    host.appendChild(el('span',{},[
      el('b',{}, `${pool.length}`),
      el('span',{}, ` question${pool.length===1?'':'s'} match your filters out of ${state.bank.length} in bank`),
    ]));
    // adjust qCount cap if needed
    const qc = $('#qCount');
    if (parseInt(qc.value,10) > pool.length) qc.value = String(pool.length);
    $('#qCountHint').textContent = `Available after filters: ${pool.length}`;
    $('#btnStartExam').disabled = pool.length === 0;
  }

  function startExam(){
    const cfg = gatherCfg();
    const pool = computePool(cfg);
    if (!pool.length){ alert('No questions match your filters. Loosen the filters or pick more topics.'); return; }
    const paperLabel = $('#paper').selectedOptions[0].textContent;
    const qCount = Math.max(1, Math.min(pool.length, parseInt($('#qCount').value,10)||pool.length));
    const isUntimed = $('#untimed') && $('#untimed').checked;
    const mins = isUntimed ? 0 : Math.max(1, parseInt($('#mins').value,10)||60);
    const modeVal = $('#mode').value;

    let arranged;
    if (cfg.arrange === 'blueprint_p1') arranged = arrangeByBlueprint(pool, 'paper1', qCount);
    else if (cfg.arrange === 'blueprint_p2') arranged = arrangeByBlueprint(pool, 'paper2', qCount);
    else if (cfg.arrange === 'blueprint_all') arranged = arrangeByBlueprint(pool, 'all', qCount);
    else arranged = arrangePool(pool, cfg.arrange);
    const trimmed = arranged.slice(0, qCount);

    const sess = newSession({
      bank: trimmed,
      paper: paperLabel,
      mode: modeVal,
      durationMs: isUntimed ? -1 : mins*60*1000,  // -1 = untimed (survives JSON)
      shuffleQ: false,            // arrangement already decided
      shuffleOpts: cfg.shuffleOpts,
      questionCount: trimmed.length,
      showAnswers: modeVal === 'tutor'
    });
    state.session = sess;
    persist();
    state.screen = 'exam';
    render();
    startTimer();
  }
}

/* ---------- Focus List ----------
   Prioritises which MRCS topics to revise by combining:
     - syllabus weight  (how much of the exam is on that topic)
     - your error rate  (wrongs / attempts in that topic)
     - volume tilt      (a small log-penalty for topics you've barely seen)
   Score = syllabus_weight * errorRate * volumeFactor
   Where volumeFactor = min(1, log2(1 + seen) / 3) so 1-2 attempts don't dominate.
   Result: expected "points recoverable per unit revision time".
*/
function buildFocusList(paper /* 'paper1'|'paper2'|'all' */){
  const att = loadAttempts();
  const blueprint = paper === 'paper1' ? MRCS_SYLLABUS.paper1
                 : paper === 'paper2' ? MRCS_SYLLABUS.paper2
                 : [...MRCS_SYLLABUS.paper1, ...MRCS_SYLLABUS.paper2].map(b=>({...b,weight:b.weight/2}));
  // aggregate per canonical bucket from the attempt log
  const per = {};
  blueprint.forEach(b => per[b.key] = {key:b.key, label:b.label, weight:b.weight, seen:0, correct:0, wrong:0, blank:0, never:0, wrongExamples:[], neverExamples:[]});
  const other = {key:'_other', label:'(Unmapped topics)', weight:0, seen:0, correct:0, wrong:0, blank:0, never:0, wrongExamples:[], neverExamples:[]};

  // also fold in bank-level "never seen" counts so focus ≠ just what you've attempted
  const bank = state.bank || [];
  bank.forEach(q => {
    const key = q.topicCanon || canonTopic(q.topicRaw || q.topic, q.subject);
    const bucket = per[key] || other;
    if (!att[q.qhash]){
      bucket.never++;
      if (bucket.neverExamples.length < 3) bucket.neverExamples.push(q.stem.slice(0,120));
    }
  });

  Object.values(att).forEach(r => {
    const key = canonTopic(r.topic, r.subject);
    const bucket = per[key] || other;
    bucket.seen += r.seen||0;
    bucket.correct += r.correct||0;
    bucket.wrong += r.wrong||0;
    bucket.blank += r.blank||0;
    if ((r.wrong||0) > 0 && bucket.wrongExamples.length < 3){
      bucket.wrongExamples.push((r.stem||'').slice(0,120));
    }
  });

  const items = [...blueprint.map(b => per[b.key]), other].filter(b => b.seen + b.never > 0);

  items.forEach(b => {
    const attempts = b.correct + b.wrong; // ignore blanks for rate
    const errRate = attempts > 0 ? (b.wrong / attempts) : 0.5; // unknown → assume 50%
    const volumeFactor = Math.min(1, Math.log2(1 + b.seen) / 3);
    // If a topic has lots of never-seen qs it should still surface
    const neverBoost = (b.never > 0) ? Math.min(0.15, b.never / (bank.length||1)) : 0;
    b.errorRate = errRate;
    b.volumeFactor = volumeFactor;
    b.neverBoost = neverBoost;
    b.priority = (b.weight || 0.02) * (errRate + neverBoost) * (0.4 + 0.6*volumeFactor);
  });

  items.sort((a,b) => b.priority - a.priority);
  return items;
}

          el('td',{style:{color:'#b71c1c'}}, String(d.wrong)),
          el('td',{style:{color:'#6f7889'}}, String(d.blank)),
          el('td',{style:{fontWeight:'bold', color: pct>=70?'#2e7d32':(pct>=50?'#a86b00':'#b71c1c')}}, pct+'%'),
        ]));
      });
      dtbl.appendChild(dtb);
      sessionDetailHost.appendChild(dtbl);
    }

    // List the actual questions from this session (matched via qhashes)
    if (h.qhashes && h.qhashes.length){
      sessionDetailHost.appendChild(el('div',{style:{marginTop:'12px',fontWeight:'bold',marginBottom:'6px'}}, `Questions in this session (${h.qhashes.length})`));
      const qHashSet = new Set(h.qhashes);
      const bankMap = {};
      state.bank.forEach(q => { bankMap[q.qhash] = q; });
      const sessionQs = h.qhashes.map(qh => bankMap[qh]).filter(Boolean);

      const sqtbl = el('table',{class:'tbl'});
      sqtbl.appendChild(el('thead',{},el('tr',{},[
        el('th',{},'#'), el('th',{},'Topic'), el('th',{},'Stem preview'), el('th',{},'Result')
      ])));
      const sqtb = el('tbody',{});
      sessionQs.forEach((q, qi) => {
        const attRec = att[q.qhash];
        // Try to find the result for THIS session from the attempt history
        let result = '';
        if (attRec && attRec.history) {
          const sessionMatch = attRec.history.find(hr => Math.abs((hr.at||hr.t||0) - h.startedAt) < 24*60*60*1000);
          if (sessionMatch) result = sessionMatch.r === 'correct' ? '\u2714' : (sessionMatch.r === 'wrong' ? '\u2718' : '\u2014');
        }
        const resColor = result === '\u2714' ? '#2e7d32' : (result === '\u2718' ? '#b71c1c' : '#6f7889');
        sqtb.appendChild(el('tr',{style:{cursor:'pointer'}, onClick:()=>{
          showQuestionDetail(sessionQs, qi, ()=>{
            showSessionDetail(h, idx);
          });
        }},[
          el('td',{}, String(qi+1)),
          el('td',{}, q.topic||''),
          el('td',{style:{maxWidth:'440px',color:'#1a5276',textDecoration:'underline'}}, (q.stem||'').slice(0,140)),
          el('td',{style:{color:resColor,fontWeight:'bold',fontSize:'16px'}}, result),
        ]));
      });
      sqtbl.appendChild(sqtb);
      sessionDetailHost.appendChild(sqtbl);
    }
  }

  sb.appendChild(sessionDetailHost);
  sb.appendChild(sessionListHost);
  sp.appendChild(sb);
  root.appendChild(sp);

  /* ---------- Full question detail viewer (used by both sessions and attempted-Q list) ---------- */
  function showQuestionDetail(qList, currentIdx, goBackFn){
    // Guard: if no questions to show, bail out
    if (!qList || !qList.length) { console.warn('[MRCS-VUE] showQuestionDetail: empty qList'); return; }
    if (currentIdx < 0 || currentIdx >= qList.length) { console.warn('[MRCS-VUE] showQuestionDetail: idx out of range', currentIdx, qList.length); return; }

    // Remove any existing overlay first, then create fresh
    const old = document.getElementById('questionDetailOverlay');
    if (old) old.remove();

    const host = document.createElement('div');
    host.id = 'questionDetailOverlay';
    host.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:20px;';
    document.body.appendChild(host);

    let curIdx = currentIdx;

    function closeOverlay(){
      host.remove();
      if(goBackFn) goBackFn();
    }

    function renderQ(idx){
      curIdx = idx;
      host.innerHTML = '';
      if (idx < 0 || idx >= qList.length) { closeOverlay(); return; }
      const q = qList[idx];
      const attRec = att[q.qhash];

      const card = document.createElement('div');
      card.style.cssText = 'background:#fff;border-radius:6px;max-width:800px;width:100%;max-height:90vh;overflow:auto;padding:24px;position:relative;box-shadow:0 8px 32px rgba(0,0,0,0.3);';

      // Top bar
      let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid #e1e4e8;padding-bottom:12px">';
      html += '<div style="display:flex;gap:8px;align-items:center">';
      html += '<button class="vbtn" id="qdBack">\u25c2 Back</button>';
      html += '<span class="note">Question '+(idx+1)+' of '+qList.length+'</span>';
      html += '</div><div style="display:flex;gap:6px">';
      html += '<button class="vbtn" id="qdPrev"'+(idx===0?' disabled':'')+' >\u25c0 Prev</button>';
      html += '<button class="vbtn" id="qdNext"'+(idx===qList.length-1?' disabled':'')+'>Next \u25b6</button>';
      html += '</div></div>';

      // Badges
      html += '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">';
      if (q.topic) html += '<span style="background:#eef4fb;border:1px solid #b8cae6;border-radius:3px;padding:2px 8px;font-size:12px">'+escH(q.topic)+'</span>';
      if (q.subject) html += '<span style="background:#f0f3f6;border:1px solid #d5dae0;border-radius:3px;padding:2px 8px;font-size:12px">'+escH(q.subject)+'</span>';
      if (q.source) html += '<span style="background:#f6f0ff;border:1px solid #d4c3f0;border-radius:3px;padding:2px 8px;font-size:12px">'+escH(q.source)+'</span>';
      html += '</div>';

      // Stem
      html += '<div style="font-size:15px;line-height:1.6;margin-bottom:16px;white-space:pre-wrap">'+escH(q.stem)+'</div>';

      // Options
      html += '<div style="margin-bottom:16px">';
      (q.options||[]).forEach(function(opt){
        const isC = opt.letter === q.correctLetter;
        const bg = isC ? '#e8f5e9':'#fff';
        const bd = isC ? '2px solid #4caf50':'1px solid #e1e4e8';
        const clr = isC ? '#2e7d32':'#333';
        html += '<div style="padding:10px 14px;margin-bottom:6px;border-radius:4px;background:'+bg+';border:'+bd+';display:flex;align-items:flex-start;gap:10px">';
        html += '<strong style="color:'+clr+';min-width:24px">'+escH(opt.letter)+'.</strong>';
        html += '<span>'+escH(opt.text)+'</span>';
        if(isC) html += '<span style="margin-left:auto;color:#2e7d32;font-weight:bold;font-size:13px">\u2714 Correct</span>';
        html += '</div>';
      });
      html += '</div>';

      // Explanation
      if (q.explanation){
        html += '<div style="background:#fffde7;border:1px solid #e5c27a;border-radius:4px;padding:12px 16px;margin-bottom:16px;line-height:1.6">';
        html += '<div style="font-weight:bold;margin-bottom:6px;color:#6d5b00">Explanation</div>';
        html += '<div style="white-space:pre-wrap">'+escH(q.explanation)+'</div></div>';
      }

      // Attempt history
      if (attRec){
        html += '<div style="border-top:1px solid #e1e4e8;padding-top:12px;margin-top:8px">';
        html += '<div style="font-weight:bold;margin-bottom:6px;font-size:13px">Your attempt history</div>';
        html += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
        (attRec.history||[]).slice(-10).forEach(function(h){
          const icon = h.r==='correct'?'\u2714':(h.r==='wrong'?'\u2718':'\u2014');
          const color = h.r==='correct'?'#2e7d32':(h.r==='wrong'?'#b71c1c':'#6f7889');
          const dt = (h.at||h.t) ? ' '+new Date(h.at||h.t).toLocaleDateString() : '';
          html += '<span style="color:'+color+';margin-right:6px;font-size:14px">'+icon+dt+'</span>';
        });
        html += '</div>';
        html += '<div class="note" style="margin-top:4px">Seen '+(attRec.seen||0)+'\u00d7 \u00b7 \u2714'+(attRec.correct||0)+' \u00b7 \u2718'+(attRec.wrong||0)+' \u00b7 \u2014'+(attRec.blank||0)+'</div>';
        html += '</div>';
      }

      // Bottom nav
      html += '<div style="display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid #e1e4e8">';
      html += '<button class="vbtn" id="qdPrev2"'+(idx===0?' disabled':'')+' >\u25c0 Previous</button>';
      html += '<button class="vbtn" id="qdClose">Close</button>';
      html += '<button class="vbtn" id="qdNext2"'+(idx===qList.length-1?' disabled':'')+'>Next \u25b6</button>';
      html += '</div>';

      card.innerHTML = html;
      host.appendChild(card);

      // Attach event handlers
      card.querySelector('#qdBack').onclick = closeOverlay;
      card.querySelector('#qdClose').onclick = closeOverlay;
      card.querySelector('#qdPrev').onclick = function(){ renderQ(idx-1); };
      card.querySelector('#qdNext').onclick = function(){ renderQ(idx+1); };
      card.querySelector('#qdPrev2').onclick = function(){ renderQ(idx-1); };
      card.querySelector('#qdNext2').onclick = function(){ renderQ(idx+1); };
      card.scrollTop = 0;
    }

    function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    renderQ(currentIdx);

    // Close on background click
    host.addEventListener('click', function(e){ if(e.target === host) closeOverlay(); });
    // Close on Escape
    function keyHandler(e){
      if (!document.getElementById('questionDetailOverlay')) { document.removeEventListener('keydown', keyHandler); return; }
      if (e.key === 'Escape') { closeOverlay(); document.removeEventListener('keydown', keyHandler); }
      else if (e.key === 'ArrowLeft' && curIdx > 0) { e.preventDefault(); renderQ(curIdx - 1); }
      else if (e.key === 'ArrowRight' && curIdx < qList.length - 1) { e.preventDefault(); renderQ(curIdx + 1); }
    }
    document.addEventListener('keydown', keyHandler);
  }

  /* Per-question leaderboard */
  const qp = el('div',{class:'panel', style:{marginTop:'16px'}});
  qp.appendChild(el('div',{class:'phead'},'Questions you have attempted'));
  const qb = el('div',{class:'pbody'});

  const rows = Object.values(att).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0));
  if (!rows.length){
    qb.appendChild(el('div',{class:'note'},'No per-question history yet.'));
  } else {
    // filter controls
    const filterWrap = el('div',{class:'row',style:{marginBottom:'8px',flexWrap:'wrap',gap:'8px'}});
    const search = el('input',{type:'text',id:'histSearch',placeholder:'Filter by stem text or topic\u2026',style:{flex:'1',minWidth:'200px',border:'1px solid #b8bfc8',padding:'6px 8px',borderRadius:'2px'}});
    const onlyWrongCb = el('input',{type:'checkbox',id:'histOnlyWrong'});
    const onlyWrong = el('label',{class:'chk'},[onlyWrongCb, el('span',{},'Only questions I\u2019ve ever gotten wrong')]);
    const notMasteredCb = el('input',{type:'checkbox',id:'histNotMastered'});
    const onlyNotMastered = el('label',{class:'chk'},[notMasteredCb, el('span',{},'Exclude mastered (correct \u22652)')]);
    filterWrap.appendChild(search);
    filterWrap.appendChild(onlyWrong);
    filterWrap.appendChild(onlyNotMastered);
    qb.appendChild(filterWrap);

    const tblHost = el('div',{id:'histQTbl'});
    qb.appendChild(tblHost);

    // Keep a reference to the last filtered list for navigation
    let lastFiltered = [];

    const build = () => {
      tblHost.innerHTML = '';
      const q = (search.value||'').toLowerCase().trim();
      const ow = onlyWrongCb.checked;
      const nm = notMasteredCb.checked;
      const filtered = rows.filter(r => {
        if (ow && (r.wrong||0) === 0) return false;
        if (nm && (r.correct||0) >= 2) return false;
        if (q && !(String(r.stem||'').toLowerCase().includes(q) || String(r.topic||'').toLowerCase().includes(q))) return false;
        return true;
      });

      // Map filtered attempt records to bank questions for the detail viewer
      const bankMap = {};
      state.bank.forEach(bq => { bankMap[bq.qhash] = bq; });
      lastFiltered = [];
      // Build index mapping: for each displayed row, track its position in lastFiltered
      const rowToFilteredIdx = [];
      filtered.forEach(r => {
        const bq = bankMap[r.qhash];
        if (bq) { rowToFilteredIdx.push(lastFiltered.length); lastFiltered.push(bq); }
        else { rowToFilteredIdx.push(-1); }
      });

      const tbl = el('table',{class:'tbl'});
      tbl.appendChild(el('thead',{},el('tr',{},[
        el('th',{},'Topic'), el('th',{},'Source'), el('th',{},'Stem preview'), el('th',{},'Seen'), el('th',{},'\u2714'), el('th',{},'\u2718'), el('th',{},'\u2014'), el('th',{},'Last'), el('th',{},'Trend'), el('th',{})
      ])));
      const tb = el('tbody',{});
      filtered.slice(0,500).forEach((r, fi) => {
        const trend = (r.history||[]).slice(-8).map(h => h.r==='correct'?'\u2714':(h.r==='wrong'?'\u2718':'\u2014')).join(' ');
        const lfIdx = rowToFilteredIdx[fi];
        tb.appendChild(el('tr',{},[
          el('td',{}, r.topic||''),
          el('td',{}, r.source||''),
          el('td',{style:{maxWidth:'440px', color:'#1a5276', textDecoration:'underline', cursor:'pointer'}, onClick:()=>{
            if (lfIdx < 0 || lfIdx >= lastFiltered.length) return;
            showQuestionDetail(lastFiltered, lfIdx, null);
          }}, (r.stem||'').slice(0,140)),
          el('td',{}, String(r.seen||0)),
          el('td',{style:{color:'#2e7d32'}}, String(r.correct||0)),
          el('td',{style:{color:'#b71c1c'}}, String(r.wrong||0)),
          el('td',{style:{color:'#6f7889'}}, String(r.blank||0)),
          el('td',{}, r.lastAt ? new Date(r.lastAt).toLocaleDateString() : ''),
          el('td',{style:{fontSize:'11px',letterSpacing:'2px'}}, trend),
          el('td',{}, el('button',{class:'vbtn', style:{fontSize:'11px',padding:'2px 8px'}, onClick:()=>{
            const a = loadAttempts(); delete a[r.qhash]; saveAttempts(a); render();
          }}, '\u2715')),
        ]));
      });
      tbl.appendChild(tb);
      tblHost.appendChild(tbl);
      tblHost.appendChild(el('div',{class:'note',style:{marginTop:'6px'}}, `${filtered.length} questions shown \u00b7 showing up to 500`));
    };
    search.addEventListener('input', build);
    onlyWrongCb.addEventListener('change', build);
    notMasteredCb.addEventListener('change', build);
    build();
  }

  qp.appendChild(qb);
  root.appendChild(qp);

  /* Actions */
  const actions = el('div',{class:'row',style:{marginTop:'14px',justifyContent:'space-between'}},[
    el('button',{class:'vbtn', onClick:()=>{ state.screen='home'; render(); }},'◂ Back'),
    el('div',{},[
      el('button',{class:'vbtn', onClick:()=>{
        if (!confirm('Clear per-question attempt log? This cannot be undone.')) return;
        localStorage.removeItem(LS_ATT); render();
      }}, 'Clear attempt log'),
      el('button',{class:'vbtn danger', style:{marginLeft:'6px'}, onClick:()=>{
        if (!confirm('Clear ALL session history? This cannot be undone.')) return;
        localStorage.removeItem(LS_HIST); render();
      }}, 'Clear all history'),
    ]),
  ]);
  root.appendChild(actions);
}

/* ---------- Dedicated session review screen ----------
   Lists every question from a chosen history session one below the other,
   with filter controls and explanations visible. Per-question result
   (correct/wrong/blank) is reconstructed from the attempt log entries
   within ±24h of the session's startedAt. */
function renderSessionReview(root){
  const rs = state.reviewSession || {};
  const h = rs.hist;
  if (!h){
    root.appendChild(el('div',{class:'note'},'No session selected.'));
    root.appendChild(el('button',{class:'vbtn', onClick:()=>{ goBack(); }},'◂ Back'));
    return;
  }
  const bankMap = {};
  (state.bank||[]).forEach(q => { bankMap[q.qhash] = q; });
  const sessionQs = (h.qhashes||[]).map(qh => bankMap[qh]).filter(Boolean);
  const missing = (h.qhashes||[]).length - sessionQs.length;

  // Reconstruct per-question result from attempt log (within ±24h of startedAt).
  // Attempt log stores {at, r:'correct'|'wrong'} — blank = no matching entry.
  const att = loadAttempts();
  const sessionTime = h.startedAt || 0;
  const resultMap = {}; // qhash -> 'correct' | 'wrong' | 'blank'
  (h.qhashes||[]).forEach(qh => {
    const rec = att[qh];
    let r = 'blank';
    if (rec && rec.history && rec.history.length){
      const match = rec.history.find(x => Math.abs((x.at||x.t||0) - sessionTime) < 24*60*60*1000);
      if (match && match.r) r = match.r;
    }
    resultMap[qh] = r;
  });

  /* Header panel with session meta + Back button */
  const head = el('div',{class:'panel'});
  head.appendChild(el('div',{class:'phead'}, `Session review — ${new Date(h.startedAt).toLocaleString()}`));
  const hbody = el('div',{class:'pbody'});
  hbody.appendChild(el('div',{style:{display:'flex',flexWrap:'wrap',gap:'14px',alignItems:'center',fontSize:'13px'}},[
    el('div',{},[el('b',{},'Paper: '), el('span',{}, h.paper||'')]),
    el('div',{},[el('b',{},'Mode: '), el('span',{}, h.mode||'')]),
    el('div',{},[el('b',{},'Total: '), el('span',{}, String(h.totalQ||sessionQs.length))]),
    el('div',{style:{color:'#2e7d32'}},[el('b',{},'Correct: '), el('span',{}, String(h.correct||0))]),
    el('div',{style:{color:'#b71c1c'}},[el('b',{},'Wrong: '), el('span',{}, String(h.wrong||0))]),
    el('div',{style:{color:'#6f7889'}},[el('b',{},'Blank: '), el('span',{}, String(h.blank||0))]),
    el('div',{},[el('b',{},'Score: '), el('span',{}, `${h.scorePct||0}%`)]),
    el('div',{},[el('b',{},'Duration: '), el('span',{}, fmtHMS(h.durationMs||0))]),
  ]));
  hbody.appendChild(el('div',{style:{marginTop:'10px',display:'flex',gap:'8px'}},[
    el('button',{class:'vbtn', onClick:()=>{ goBack(); }},'◂ Back to history'),
    el('button',{class:'vbtn', onClick:()=>{ screenHistory.length=0; state.screen='home'; render(); }},'Home'),
  ]));
  if (missing > 0){
    hbody.appendChild(el('div',{class:'note',style:{marginTop:'8px',color:'#b71c1c'}},
      `${missing} question(s) from this session are no longer in the current bank and cannot be shown.`));
  }
  head.appendChild(hbody);
  root.appendChild(head);

  /* Filter controls */
  const filters = { res:'all', subject:'__all__', search:'' };
  const subjects = [...new Set(sessionQs.map(q => q.subject).filter(Boolean))].sort();

  const filterPanel = el('div',{class:'panel',style:{marginTop:'12px'}});
  filterPanel.appendChild(el('div',{class:'phead'},'Filters'));
  const fbody = el('div',{class:'pbody'});

  // Result pills
  const pillRow = el('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'8px'}});
  const countsByRes = { all: sessionQs.length, correct:0, wrong:0, blank:0 };
  sessionQs.forEach(q => { countsByRes[resultMap[q.qhash]||'blank']++; });
  const pills = [
    {k:'all', label:`All (${countsByRes.all})`, color:'#1a1a1a'},
    {k:'correct', label:`✔ Correct (${countsByRes.correct})`, color:'#2e7d32'},
    {k:'wrong', label:`✘ Wrong (${countsByRes.wrong})`, color:'#b71c1c'},
    {k:'blank', label:`◌ Blank (${countsByRes.blank})`, color:'#6f7889'},
  ];
  const pillEls = {};
  pills.forEach(p => {
    const b = el('button',{
      class:'vbtn',
      style:{fontSize:'12px',padding:'4px 10px',color:p.color,borderColor:p.color,
             fontWeight: filters.res===p.k ? 'bold':'normal',
             background: filters.res===p.k ? '#eef3ff':'#fff'},
      onClick:()=>{ filters.res = p.k; applyFilters(); }
    }, p.label);
    pillEls[p.k] = b;
    pillRow.appendChild(b);
  });
  fbody.appendChild(pillRow);

  // Subject + search row
  const subSel = el('select',{id:'sr_sub'});
  subSel.appendChild(el('option',{value:'__all__'}, `All subjects (${sessionQs.length})`));
  subjects.forEach(s => {
    const n = sessionQs.filter(q => q.subject===s).length;
    subSel.appendChild(el('option',{value:s}, `${s} (${n})`));
  });
  subSel.onchange = () => { filters.subject = subSel.value; applyFilters(); };

  const searchInp = el('input',{type:'text',placeholder:'Search stem, topic, explanation…',
                                style:{padding:'4px 8px',minWidth:'260px'}});
  searchInp.oninput = () => { filters.search = (searchInp.value||'').toLowerCase(); applyFilters(); };

  fbody.appendChild(el('div',{style:{display:'flex',flexWrap:'wrap',gap:'12px',alignItems:'center'}},[
    el('label',{class:'chk'},[el('span',{},'Subject: '), subSel]),
    el('label',{class:'chk'},[el('span',{},'Search: '), searchInp]),
    el('span',{id:'sr_count',style:{fontSize:'12px',color:'#555',marginLeft:'8px'}},''),
  ]));
  filterPanel.appendChild(fbody);
  root.appendChild(filterPanel);

  /* Questions list */
  const listPanel = el('div',{class:'panel',style:{marginTop:'12px'}});
  listPanel.appendChild(el('div',{class:'phead'},'Questions — one below the other, with explanations'));
  const listBody = el('div',{class:'pbody'});
  listPanel.appendChild(listBody);
  root.appendChild(listPanel);

  function buildQuestionBlock(q, origIdx){
    const r = resultMap[q.qhash] || 'blank';
    const isCorrect = (r === 'correct');
    const isWrong   = (r === 'wrong');
    const block = el('div',{style:{border:'1px solid #d5dae0',borderRadius:'2px',marginBottom:'10px'}});
    const hdrBg = isCorrect?'#e9f5ea':(isWrong?'#fbeaea':'#f6f8fa');
    const hdrRight = isCorrect?'✔ Correct':(isWrong?'✘ Wrong':'◌ Blank');
    block.appendChild(el('div',{
      style:{padding:'8px 12px',background:hdrBg,borderBottom:'1px solid #d5dae0',
             fontSize:'12px',display:'flex',justifyContent:'space-between',gap:'10px',flexWrap:'wrap'}
    },[
      el('b',{}, `Q${origIdx+1}`),
      el('span',{style:{color:'#555'}}, `${q.topic||''}${q.subject ? ' · '+q.subject : ''}`),
      el('span',{style:{color:'#555'}}, q.source||''),
      el('span',{style:{fontWeight:'bold',color:isCorrect?'#2e7d32':(isWrong?'#b71c1c':'#6f7889')}}, hdrRight),
    ]));
    const b = el('div',{style:{padding:'10px 12px'}});
    b.appendChild(el('div',{style:{whiteSpace:'pre-wrap',marginBottom:'8px'}}, q.stem));
    (q.options||[]).forEach(o => {
      const ok = q.correctLetter === o.letter;
      const color = ok ? '#2e7d32' : '#1a1a1a';
      const tag = ok ? ' (correct answer)' : '';
      b.appendChild(el('div',{style:{color,margin:'2px 0',fontWeight:ok?'bold':'normal'}},
                            `${o.letter}. ${o.text}${tag}`));
    });
    if (q.explanation){
      b.appendChild(el('div',{style:{marginTop:'10px',padding:'8px 10px',background:'#f9fafb',
                                     border:'1px solid #e3e6eb',borderRadius:'2px',
                                     whiteSpace:'pre-wrap',fontSize:'13px'}},
                          q.explanation));
    }
    if (isWrong){
      b.appendChild(el('div',{class:'note',style:{marginTop:'6px',color:'#888',fontSize:'11px'}},
        'Note: the specific option you picked is not stored in the attempt log — only pass/fail is recorded.'));
    }
    block.appendChild(b);
    return block;
  }

  function applyFilters(){
    // Update pill styling
    pills.forEach(p => {
      const b = pillEls[p.k];
      b.style.fontWeight = filters.res===p.k ? 'bold':'normal';
      b.style.background = filters.res===p.k ? '#eef3ff':'#fff';
    });
    listBody.innerHTML = '';
    let shown = 0;
    sessionQs.forEach((q, i) => {
      const r = resultMap[q.qhash] || 'blank';
      if (filters.res !== 'all' && r !== filters.res) return;
      if (filters.subject !== '__all__' && q.subject !== filters.subject) return;
      if (filters.search){
        const hay = `${q.stem||''} ${q.topic||''} ${q.explanation||''}`.toLowerCase();
        if (hay.indexOf(filters.search) < 0) return;
      }
      listBody.appendChild(buildQuestionBlock(q, i));
      shown++;
    });
    const cnt = $('#sr_count');
    if (cnt) cnt.textContent = `Showing ${shown} of ${sessionQs.length} question(s).`;
    if (shown === 0){
      listBody.appendChild(el('div',{class:'note'},'No questions match the current filters.'));
    }
  }
  applyFilters();
}

function confirmEnd(){
  const sess = state.session;
  const unanswered = sess.questions.filter(q=>!q.selected).length;
  const flagged = sess.questions.filter(q=>q.flagged).length;
  openConfirm({
    title:'End Exam',
    body:`You have ${unanswered} unanswered and ${flagged} flagged questions.\n\nOnce you end the exam, your answers will be scored and you won't be able to change them. Continue?`,
    ok:'End Exam', okCls:'vbtn danger',
    onOk: () => { endExam(); }
  });
}

function endExam(){
  stopTimer();
  const sess = state.session;
  sess.submitted = true;
  sess.endedAt = Date.now();

  // Write per-question attempt log — only for ATTEMPTED questions (skip blanks)
  sess.questions.forEach(q => {
    if (!q.qhash || !q.selected) return;
    const result = q.selected === q.correctLetter ? 'correct' : 'wrong';
    recordAttempt(q, result);
  });

  // Append to history — only count ATTEMPTED questions (not blanks)
  const attemptedQs = sess.questions.filter(q => q.selected);
  const totalQ = attemptedQs.length;
  const correct = attemptedQs.filter(q => q.correctLetter && q.selected === q.correctLetter).length;
  const wrong = attemptedQs.filter(q => q.selected && q.correctLetter && q.selected !== q.correctLetter).length;
  const blank = 0; // only attempted questions are tracked
  const topicBreakdown = {};
  attemptedQs.forEach(q => {
    const t = q.topic || '(untagged)';
    topicBreakdown[t] = topicBreakdown[t] || {total:0, correct:0, wrong:0, blank:0};
    topicBreakdown[t].total++;
    if (q.selected === q.correctLetter) topicBreakdown[t].correct++;
    else topicBreakdown[t].wrong++;
  });
  const hist = loadHistory();
  hist.unshift({
    id: sess.id, paper: sess.paper, mode: sess.mode,
    startedAt: sess.startedAt, endedAt: sess.endedAt,
    durationMs: sess.endedAt - sess.startedAt,
    totalQ, correct, wrong, blank,
    scorePct: totalQ ? Math.round(100*correct/totalQ) : 0,
    topicBreakdown,
    qhashes: attemptedQs.map(q => q.qhash)
  });
  saveHistory(hist.slice(0,200));

  persist();
  state.screen = 'results';
  render();
}

function downloadResults(sess){
  const head = ['#','Topic','Source','YourAnswer','CorrectAnswer','Correct?','Stem'];
  const rows = sess.questions.map((q,i)=>[
    String(i+1),
    q.topic||'', q.source||'',
    q.selected||'', q.correctLetter||'',
    q.selected ? (q.selected === q.correctLetter ? 'Y':'N') : 'BLANK',
    q.stem.replace(/\s+/g,' ').slice(0,600)
  ]);
  downloadCsv('mrcs-results-'+new Date().toISOString().slice(0,10)+'.csv', [head, ...rows]);
}
function downloadWrongCSV(sess){
  const head = ['Question','A','B','C','D','E','Correct','Explanation','Topic','Source','YourAnswer'];
  const rows = sess.questions
    .filter(q => q.selected && q.correctLetter && q.selected !== q.correctLetter)
    .map(q => {
      const letters = ['A','B','C','D','E'];
      const cells = letters.map(L => (q.options.find(o=>o.letter===L)?.text)||'');
      return [q.stem, ...cells, q.correctLetter, q.explanation||'', q.topic||'', q.source||'', q.selected||''];
    });
  if (!rows.length){ alert('No wrong questions to export.'); return; }
  downloadCsv('mrcs-wrong-'+new Date().toISOString().slice(0,10)+'.csv', [head, ...rows]);
}
function downloadCsv(filename, rows){
  const esc = s => { const t = String(s==null?'':s); return /[",\n]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };
  const text = rows.map(r => r.map(esc).join(',')).join('\n');
  const blob = new Blob([text], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{a.remove(); URL.revokeObjectURL(a.href);},200);
}

/* ---------- Focus exam shortcut ---------- */
function buildFocusExam(canonLabels, qCount, mins){
  // Map canonical labels back to all bank questions whose topic canonicalises to any of these
  const labelToKey = {};
  [...MRCS_SYLLABUS.paper1, ...MRCS_SYLLABUS.paper2].forEach(b => labelToKey[b.label] = b.key);
  const wantKeys = new Set(canonLabels.map(l => labelToKey[l]).filter(Boolean));
  const pool = (state.bank||[]).filter(q => wantKeys.has(q.topicCanon || canonTopic(q.topic, q.subject)) && q.correctLetter);
  if (!pool.length){ alert('No matching questions in your bank for those topics. Upload more, or loosen the topic mapping.'); return; }
  // Prioritise ones you got wrong / never seen
  const att = loadAttempts();
  pool.sort((a,b) => {
    const ra = att[a.qhash], rb = att[b.qhash];
    const aScore = (ra ? ((ra.wrong||0) - (ra.correct||0)) : 1);
    const bScore = (rb ? ((rb.wrong||0) - (rb.correct||0)) : 1);
    return bScore - aScore;
  });
  const picked = pool.slice(0, qCount);
  shuffle(picked);
  const sess = newSession({
    bank: picked,
    paper: `Focus block — ${canonLabels.join(' / ')}`,
    mode: 'strict',
    durationMs: mins*60*1000,
    shuffleQ:false, shuffleOpts:false,
    questionCount: picked.length,
    showAnswers: false
  });
  state.session = sess;
  persist();
  state.screen = 'exam';
  render();
  startTimer();
}
function downloadFocusList(items, paper){
  const head = ['Rank','Topic','SyllabusWeight%','Attempts','Correct','Wrong','NeverSeen','ErrorRate%','Priority','Action'];
  const rows = items.map((b,i) => [
    i+1, b.label,
    b.weight ? Math.round(b.weight*100) : '',
    b.seen, b.correct, b.wrong, b.never,
    isFinite(b.errorRate) ? Math.round(b.errorRate*100) : '',
    b.priority ? b.priority.toFixed(4) : '',
    ''
  ]);
  downloadCsv(`mrcs-focuslist-${paper}-${new Date().toISOString().slice(0,10)}.csv`, [head, ...rows]);
}

/* ---------- Timer ---------- */
function startTimer(){
  stopTimer();
  const sess = state.session;
  if (!sess) return;
  const isUntimed = sess.durationMs < 0;
  if (isUntimed && !sess._elapsedMs) sess._elapsedMs = 0;
  const tick = () => {
    if (!state.session || state.session.submitted) return stopTimer();
    const t = $('#timer');
    if (isUntimed){
      sess._elapsedMs = (sess._elapsedMs||0) + 1000;
      if (t){ t.textContent = fmtHMS(sess._elapsedMs); t.classList.remove('warn'); }
    } else {
      sess.timeLeftMs -= 1000;
      if (t){
        t.textContent = fmtHMS(sess.timeLeftMs);
        if (sess.timeLeftMs <= 5*60*1000) t.classList.add('warn'); else t.classList.remove('warn');
      }
      if (sess.timeLeftMs <= 0){ stopTimer(); alert('Time is up. Submitting.'); endExam(); }
    }
    // persist every 15s
    const counter = isUntimed ? Math.floor((sess._elapsedMs||0)/1000) : Math.floor(sess.timeLeftMs/1000);
    if (counter % 15 === 0) persist();
  };
  const t = $('#timer');
  if (t){
    if (isUntimed){
      t.textContent = fmtHMS(sess._elapsedMs||0);
      const lbl = $('#timerLabel');
      if (lbl) lbl.textContent = 'Time Elapsed';
    } else {
      t.textContent = fmtHMS(sess.timeLeftMs);
    }
  }
  state.timerHandle = setInterval(tick, 1000);
}
function stopTimer(){ if (state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle=null; } }

/* ---------- Persistence ---------- */
function persist(){
  if (!state.session) return;
  // Only save session data — NOT the full bank (which is already in LS_BANK).
  // Storing both caused localStorage quota (~5 MB) to silently overflow,
  // losing session data on refresh.
  saveLS(LS_KEY, {session: state.session});
}

/* ---------- Confirm modal ---------- */
function openConfirm({title,body,ok='OK',okCls='vbtn primary',onOk}){
  const back = el('div',{class:'confirm-backdrop'});
  const box = el('div',{class:'confirm-box'});
  box.appendChild(el('div',{class:'hd'}, title));
  box.appendChild(el('div',{class:'bd', style:{whiteSpace:'pre-wrap'}}, body));
  const ft = el('div',{class:'ft'});
  const cancel = el('button',{class:'vbtn'}, 'Cancel');
  cancel.addEventListener('click', ()=> back.remove());
  const okb = el('button',{class:okCls}, ok);
  okb.addEventListener('click', ()=> { back.remove(); onOk && onOk(); });
  ft.appendChild(cancel); ft.appendChild(okb);
  box.appendChild(ft); back.appendChild(box);
  document.body.appendChild(back);
}

/* ---------- Back button ---------- */
$('#btnBack').addEventListener('click', ()=>{
  // During exam, confirm before leaving
  if (state.screen === 'exam' || state.screen === 'review'){
    if (!confirm('Leave the exam? Your progress is saved — you can resume from the home screen.')) return;
    stopTimer();
    state.session.paused = true;
    persist();
    screenHistory.length = 0; // clear history stack
    state.screen = 'home'; render();
  } else {
    goBack();
  }
});

/* ---------- Pause button ---------- */
$('#btnPause').addEventListener('click', pauseExam);

/* ---------- Help modal ---------- */
$('#btnHelp').addEventListener('click', ()=>{
  openConfirm({
    title:'Keyboard shortcuts',
    body:`A–E : select option\n← / → : previous / next question\nF : flag / unflag\nR : review screen\nSpace : reveal answer (on-demand mode)\nCtrl+Enter : end exam`,
    ok:'Close'
  });
});

document.addEventListener('keydown', (e)=>{
  if (state.screen !== 'exam') return;
  const sess = state.session; if (!sess) return;
  const q = sess.questions[sess.idx];
  const k = e.key.toLowerCase();
  if (['a','b','c','d','e'].includes(k)){
    const letter = k.toUpperCase();
    if (q.options.find(o=>o.letter===letter)){ q.selected = letter; persist(); render(); }
  } else if (e.key === 'ArrowLeft'){ if (sess.idx>0){ sess.idx--; persist(); render(); } }
  else if (e.key === 'ArrowRight'){
    if (sess.idx < sess.questions.length-1){ sess.idx++; persist(); render(); }
    else { state.screen='review'; render(); }
  }
  else if (k === 'f'){ q.flagged = !q.flagged; persist(); render(); }
  else if (k === 'r'){ state.screen='review'; render(); }
  else if (k === ' '){ if (sess.mode === 'toggle'){ q.revealed = !q.revealed; persist(); render(); e.preventDefault(); } }
  else if (e.ctrlKey && e.key === 'Enter'){ confirmEnd(); }
});

/* ---------- Refresh protection ---------- */
window.addEventListener('beforeunload', (e) => {
  if (state.session && !state.session.submitted){
    persist(); // save state one last time
    e.preventDefault();
    e.returnValue = ''; // triggers browser "are you sure?" dialog
  }
});

const _origPersist = persist;
persist = function(){
  _origPersist();
};

/* ---------- Bootstrap ---------- */
/*__EMBEDDED_BANK_BOOT_START__*/
(async function seedBank(){
  try {
    const existing = loadLS(LS_BANK);
    const isCustomUpload = existing && existing.bank && existing.bank.length && !existing.embedded;
    if (isCustomUpload) {
      existing.bank.forEach(q => { if (!q.qhash) q.qhash = hashStem(q.stem); });
      state.bank = existing.bank;
      console.log('[MRCS-VUE] Loaded custom bank from localStorage:', state.bank.length, 'questions');
    } else {
      const resp = await fetch('data/questions_bank.json');
      if (!resp.ok) throw new Error('Bank fetch failed: ' + resp.status);
      const bank = await resp.json();
      state.bank = bank;
      try { localStorage.removeItem(LS_BANK); } catch(e){}
      try { localStorage.removeItem('mrcs-vue:bank-version'); } catch(e){}
      console.log('[MRCS-VUE] Loaded bank from JSON:', bank.length, 'questions');
    }
  } catch (e) {
    console.warn('[MRCS-VUE] seedBank failed:', e);
    const root = document.getElementById('root');
    if (root && !state.bank.length) {
      root.innerHTML = '<div style="padding:40px;text-align:center;color:#b71c1c"><h2>Could not load question bank</h2><p>Check that <code>data/questions_bank.json</code> is in the same directory as this file.</p><p style="color:#6f7889;font-size:13px">Error: '+e.message+'</p></div>';
    }
  }
  render();
  if (state.screen === 'exam' && state.session) startTimer();
})();
/*__EMBEDDED_BANK_BOOT_END__*/

/* ---------- Auto-resume on refresh ---------- */
// If there's an in-progress session in localStorage, jump straight back
// into the exam instead of making the user click "Resume".
(function autoResume(){
  try {
    const saved = loadLS(LS_KEY);
    if (saved && saved.session && !saved.session.submitted){
      state.session = saved.session;
      state.session.paused = false;
      state.screen = 'exam';
      console.log('[MRCS-VUE] Auto-resumed in-progress exam');
    }
  } catch(e){ console.warn('[MRCS-VUE] autoResume failed:', e); }
})();

// render() and startTimer() are called inside seedBank() above
</script>
